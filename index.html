<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danilo</title>
  
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="assets/global.css">
  <link rel="stylesheet" href="assets/index.css">
  <link rel="icon" href="assets/portfolioImgs/JD_Logo.png" type="image/png">

</head>
<body class="portfolio-page d-flex flex-column min-vh-100">

  <!-- Fixed Hyperspace Canvas Background -->
  <canvas id="hyperspace" aria-hidden="true"></canvas>

  <!-- Centered Navigation Capsule -->
  <header class="navbar-wrapper container-fluid px-3 px-lg-5 pt-3 pt-md-4 flex-shrink-0">
    <nav class="navbar navbar-expand-lg header-pill mx-auto">
      <div class="container-fluid p-0 d-flex justify-content-between align-items-center">
        
        <!-- Left Responsive Logo -->
        <a class="navbar-brand d-flex align-items-center m-0 py-0" href="index.html">
          <img src="assets/portfolioImgs/JD_Logo.png" alt="JD Logo" class="brand-logo" onerror="this.src='https://placehold.co/60x60/1b4776/ffffff?text=JD'">
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0 text-white shadow-none p-1" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
          <i class="fas fa-bars fa-lg"></i>
        </button>

        <!-- Floating Overlay Nav Links -->
        <div class="collapse navbar-collapse justify-content-center" id="navContent">
          <ul class="navbar-nav gap-1 gap-lg-2 align-items-center my-1 my-lg-0 text-center">
            <li class="nav-item w-100 w-lg-auto">
              <a class="nav-link-pill active" href="/">Home</a>
            </li>
            <li class="nav-item w-100 w-lg-auto">
              <a class="nav-link-pill" href="/aboutMe">About</a>
            </li>
            <li class="nav-item w-100 w-lg-auto">
              <a class="nav-link-pill" href="/projects">Projects</a>
            </li>
            <li class="nav-item w-100 w-lg-auto">
              <a class="nav-link-pill" href="/contact">Contacts</a>
            </li>
          </ul>
        </div>

        <!-- Right Balance Spacer for Desktop Symmetry -->
        <div class="d-none d-lg-block header-spacer" aria-hidden="true"></div>

      </div>
    </nav>
  </header>

  <!-- Strictly Centered Hero Section (Vertical & Horizontal) -->
  <main class="hero-container flex-grow-1 d-flex flex-column align-items-center justify-content-center text-center px-3 py-4 w-100">
    
    <div class="w-100" style="max-width: 860px;">
      <!-- Title Block -->
      <div class="hero-header-block mb-4 text-center">
        <div class="text-welcome">WELCOME TO</div>
        <h1 class="text-danilos my-1">DANILO’S</h1>
        <div class="text-portfolio">PORTFOLIO</div>
      </div>
      <!-- Centered Pill Badges -->
      <div class="pill-badge-group mb-3 text-center">
        <!-- Row 1: QA, FRONT-END DESIGNER, UI/UX -->
        <div class="d-flex flex-wrap gap-1 gap-md-2 justify-content-center mb-2">
          <span class="badge-bubble">QA</span>
          <span class="badge-bubble">FRONT-END DESIGNER</span>
          <span class="badge-bubble">UI/UX</span>
        </div>
        <!-- Row 2: AVAILABLE FOR WORK -->
        <div class="d-flex justify-content-center">
          <span class="badge-bubble badge-bubble-active">AVAILABLE FOR WORK</span>
        </div>
      </div>

      <!-- View My CV Button -->
      <div class="cv-action-wrapper text-center">
        <a href="https://drive.google.com/file/d/1AeHczlhtQ6V5-62X_yZ2UaAxezVkIfQX/view?usp=sharing" target="_blank" rel="noopener noreferrer" class="cv-button">
          View my CV
        </a>
      </div>
    </div>

  </main>

  <!-- Centered Footer Bar -->
  <footer class="footer-strip py-3 px-3 px-lg-5 mt-auto flex-shrink-0">
    <div class="container-fluid d-flex flex-column flex-md-row align-items-center justify-content-between p-0 gap-2">
      
      <div class="footer-logo d-flex justify-content-center justify-content-md-start" style="min-width: 48px;">
        <img src="assets/portfolioImgs/JD_Logo.png" alt="JD Logo" class="brand-logo-small" onerror="this.src='https://placehold.co/42x42/1b4776/ffffff?text=JD'">
      </div>
      
      <div class="footer-copyright text-center flex-grow-1">
        <span>© 2026 Joseph Maliza. All Rights Reserved</span>
      </div>

      <div class="footer-spacer d-none d-md-block" style="min-width: 48px;" aria-hidden="true"></div>
      
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/stars.js"></script>

</body>
</html>
